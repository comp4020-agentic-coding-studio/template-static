<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMP4020 prototype</title>
    <meta
      name="description"
      content="Replace this with one sentence saying what this page is. A search result and a link preview both show it."
    />

    <!--
      What a link to this page looks like when someone shares it. og:title and
      og:description are deliberately absent: scrapers fall back to the <title>
      and the description above, and two copies of the same sentence only drift
      apart. og:image has no fallback, so without it a shared link renders as a
      bare row of text.

      The card is public/card.png --- replace it, and keep it 1200x630. Its URL
      is resolved against the page that names it, like any link: page-relative
      is right for a page at the site root, and a head shared across pages (a
      layout) wants a root-absolute path under the repo's base instead. The
      course gallery resolves either; some chat platforms only honour an
      absolute URL, so off-site previews are best-effort.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>COMP4020 prototype</h1>
      <p data-testid="intro">
        Replace this with your prototype. This week's brief is on the course website;
        <code>spec/README.md</code> explains how the checks in this repo relate to it.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
